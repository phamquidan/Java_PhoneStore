<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html-head('403 - Từ chối truy cập - TechSophist')}"></head>
<body>

<!-- Header Navigation -->
<header th:replace="~{fragments/layout :: topbar}"></header>

<!-- Main Container -->
<main class="container" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 180px);">
    
    <section class="card" style="width: 100%; max-width: 520px; text-align: center; padding: 48px; border-radius: var(--radius-lg); box-shadow: var(--shadow-level-2);">
        <div style="font-size: 64px; color: var(--error); margin-bottom: 24px;">
            <i class="bi bi-shield-slash"></i>
        </div>
        
        <h2 class="headline-md" style="margin-bottom: 8px;">403 - Từ chối truy cập</h2>
        <p class="body-md" style="color: var(--on-surface-variant); margin-bottom: 32px;">Tài khoản của bạn không được cấp quyền truy cập vào phân hệ quản lý này. Vui lòng liên hệ quản trị viên hoặc quay lại trang chủ.</p>
        
        <div class="actions" style="justify-content: center; gap: 16px;">
            <a class="btn btn-primary" th:href="@{/}">
                <i class="bi bi-house-door"></i> Về trang chủ
            </a>
            <a class="btn btn-secondary" onclick="history.back()">
                <i class="bi bi-arrow-left"></i> Quay lại trang trước
            </a>
        </div>
    </section>

</main>

<!-- Footer -->
<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
